
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tinker.twobrain.ai;
    
    ssl_certificate /etc/letsencrypt/live/tinker.twobrain.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tinker.twobrain.ai/privkey.pem;
    
    root /var/www/html/pwa;
    index index.html login.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Main app - serve from PWA root
    location / {
        try_files $uri $uri/ /login.html;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
    
    # SignalR WebSocket
    location /chatHub {
        proxy_pass http://api_backend/chatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
    
    # Mock auth validate endpoint
    location = /api/auth/validate {
        add_header Content-Type application/json;
        return 200 '{"isValid":false}';
    }
    
    # PWA specific
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    
    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tinker.twobrain.ai;
    return 301 https://$server_name$request_uri;
}
